name: Generate Monthly Posts

# THE BUTTON: Actions -> Generate Monthly Posts -> Run workflow
on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to generate (YYYY-MM). Leave empty for next month.'
        required: false
        type: string
      force:
        description: 'Overwrite an existing plan for that month'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mody-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Preflight
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: npm run doctor

      - name: Generate the month
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MONTH: ${{ inputs.month }}
        run: node src/generate.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit the month
        run: |
          git config user.name  "mody-social bot"
          git config user.email "actions@github.com"
          git add posts data
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "content: generate posts for ${{ inputs.month || 'next month' }}"
            git push
          fi

      - name: Upload the review sheet
        uses: actions/upload-artifact@v4
        with:
          name: review-sheet
          path: posts/*/index.html
          retention-days: 30
