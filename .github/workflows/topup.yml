name: Daily Buffer Top-Up

# Keeps every channel at TARGET_QUEUE scheduled posts, staying under Buffer's
# free-plan cap of 10 queued posts per channel.
on:
  schedule:
    # every three hours: with two posts a day, a once-daily run cannot refill a
    # slot that frees at 10:00 before the 20:00 reel needs to be queued
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mody-topup
  cancel-in-progress: false

jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Top up Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          TARGET_QUEUE: ${{ vars.TARGET_QUEUE || 7 }}
        run: node src/topup.mjs

      - name: Record what was scheduled
        run: |
          git config user.name  "mody-social bot"
          git config user.email "actions@github.com"
          git add posts data
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "ops: record scheduled posts"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "could not push after 5 attempts"
          exit 1