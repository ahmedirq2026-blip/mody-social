<meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url(data:font/woff2;base64,__FONT_B64__) format('woff2');
  font-weight:200 800;font-style:normal;font-display:block}
:root{--navy:#00448C;--blue:#005BB7;--cyan:#00CCF9;--deep:#00344A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#00344A}
body{font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--deep)}

.photo{position:absolute;inset:0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:50% 45%;
  filter:saturate(1.07) contrast(1.05) brightness(1.02)}
.tint{position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,204,249,.05),rgba(0,68,140,.09))}
.topfade{position:absolute;left:0;right:0;top:0;height:28%;
  background:linear-gradient(180deg,rgba(0,52,74,.70),rgba(0,52,74,0))}
.botfade{position:absolute;left:0;right:0;bottom:0;height:70%;
  background:linear-gradient(180deg,rgba(0,52,74,0),rgba(0,52,74,.70) 38%,rgba(0,52,74,.95) 72%,rgba(0,52,74,.98))}

.badge{position:absolute;top:210px;left:80px;display:flex;align-items:center;gap:22px;
  background:rgba(0,52,74,.46);border:1px solid rgba(255,255,255,.20);
  backdrop-filter:blur(18px) saturate(1.2);border-radius:999px;padding:14px 34px 14px 14px}
.badge img{width:112px;height:112px;border-radius:50%;object-fit:cover;
  box-shadow:0 10px 34px rgba(0,0,0,.34),0 0 0 4px rgba(255,255,255,.92)}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-weight:800;font-size:36px;letter-spacing:-.02em;color:#fff;text-shadow:0 2px 12px rgba(0,26,38,.55)}
.wm span{font-weight:700;font-size:17px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--cyan);margin-top:8px;text-shadow:0 2px 10px rgba(0,26,38,.6)}

.chip{position:absolute;top:232px;right:240px;display:inline-flex;align-items:center;gap:12px;
  font-weight:800;font-size:26px;color:#fff;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.26);padding:16px 30px;border-radius:999px;backdrop-filter:blur(14px)}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--cyan);display:block}

.stack{position:absolute;left:80px;right:230px;bottom:440px;display:flex;flex-direction:column;gap:26px}
.rule{height:8px;width:150px;border-radius:99px;background:var(--cyan)}
.eyebrow{font-weight:800;font-size:28px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.h1,.h2{font-weight:800;font-size:96px;line-height:.98;letter-spacing:-.035em;color:#fff}
.h2{color:var(--cyan)}
.sub{font-weight:500;font-size:35px;line-height:1.32;color:rgba(255,255,255,.82);max-width:92%}
.cta{align-self:flex-start;display:inline-flex;align-items:center;gap:14px;background:var(--cyan);
  color:var(--deep);font-weight:800;font-size:36px;padding:26px 46px;border-radius:999px;
  box-shadow:0 16px 44px rgba(0,204,249,.30)}
.cta svg{width:34px;height:34px}
.foot{display:flex;align-items:center;flex-wrap:wrap;gap:10px 18px;font-weight:700;font-size:22px;
  letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.74);max-width:96%}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none;display:block}
</style>

<div id="stage">
  <div class="photo"><img id="bg" alt=""></div>
  <div class="tint"></div>
  <div class="topfade"></div>
  <div class="botfade"></div>

  <div class="badge" id="badge"><img id="logo" alt=""><div class="wm"><b id="wmName"></b><span id="wmCity"></span></div></div>
  <div class="chip" id="chip"><i></i><span id="chipText"></span></div>

  <div class="stack">
    <div class="rule"  id="a-rule"></div>
    <div class="eyebrow" id="a-eyebrow"></div>
    <div class="h1"    id="a-h1"></div>
    <div class="h2"    id="a-h2"></div>
    <div class="sub"   id="a-sub"></div>
    <div><span class="cta" id="a-cta"></span></div>
    <div class="foot"  id="a-foot"></div>
  </div>
</div>

<script>
(() => {
const D = /*__DATA__*/ null;
const $ = id => document.getElementById(id);

$('bg').src = D.photoSrc;
if (D.logoSrc) $('logo').src = D.logoSrc; else $('logo').remove();
$('wmName').textContent = D.name;
$('wmCity').textContent = D.city;
$('chipText').textContent = D.chip;
$('a-eyebrow').textContent = D.eyebrow;
$('a-h1').textContent = D.headline[0];
$('a-h2').textContent = D.headline[1];
$('a-sub').textContent = D.sub;
$('a-cta').innerHTML = D.cta +
  ' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"/></svg>';
$('a-foot').innerHTML = D.footer.map(f => `<span>${f}</span>`).join('<i></i>');

const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
// progress of a cue that starts at `start` and lasts `dur`
const cue = (t, start, dur) => easeOut(clamp01((t - start) / dur));

// Every element is a pure function of time, so a frame is reproducible and the
// capture never depends on wall-clock animation timing.
const RISE = [
  ['a-rule',    0.7, 0.5,  40],
  ['a-eyebrow', 0.9, 0.5,  40],
  ['a-h1',      1.3, 0.6,  70],
  ['a-h2',      1.6, 0.6,  70],
  ['a-sub',     2.2, 0.6,  50],
  ['a-cta',     2.7, 0.6,  46],
  ['a-foot',    3.1, 0.6,  34]
];

window.__seek = (t) => {
  const dur = D.duration;

  // slow push-in for the whole clip keeps the frame alive
  const z = 1 + 0.11 * (t / dur);
  $('bg').style.transform = `scale(${z.toFixed(5)})`;
  $('bg').style.opacity = clamp01(t / 0.5).toFixed(3);

  const b = cue(t, 0.25, 0.6);
  $('badge').style.opacity = b.toFixed(3);
  $('badge').style.transform = `translateX(${(-60 * (1 - b)).toFixed(2)}px)`;

  const c = cue(t, 0.5, 0.6);
  $('chip').style.opacity = c.toFixed(3);
  $('chip').style.transform = `translateX(${(60 * (1 - c)).toFixed(2)}px)`;

  for (const [id, start, len, dy] of RISE) {
    const p = cue(t, start, len);
    const el = $(id).classList.contains('cta') ? $(id).parentElement : $(id);
    el.style.opacity = p.toFixed(3);
    el.style.transform = `translateY(${(dy * (1 - p)).toFixed(2)}px)`;
  }

  // the CTA gets one gentle pulse once it has settled
  const pulseAt = 5.2;
  const pp = clamp01((t - pulseAt) / 0.55);
  const pulse = pp > 0 && pp < 1 ? 1 + 0.05 * Math.sin(pp * Math.PI) : 1;
  $('a-cta').style.transform = `scale(${pulse.toFixed(4)})`;

  // fade the whole frame out at the very end so the loop is clean
  const out = clamp01((t - (dur - 0.45)) / 0.45);
  document.getElementById('stage').style.opacity = (1 - out * 0.85).toFixed(3);
};

window.__seek(0);
window.__READY__ = true;
})();
</script>
